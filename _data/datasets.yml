- name: "CESM-ATM"
  source: "Mark Taylor (SNL)"
  source_url: ""
  type: "Climate simulation"
  format: |
    Dataset1: 79 fields, 2D, 1800x3600
    Dataset2: 1 field, 3D, 26x1800x3600
    Both single precision, binary
  entropy:
    - label: ""
      rows:
        - { stat: "avg", e8: "6.5", e32: "19.8" }
        - { stat: "min", e8: "1.5", e32: "2.3" }
        - { stat: "max", e8: "7.8", e32: "22.6" }

  size: |
    Dataset1 (raw): 1.47GB
    Dataset1 (cleared): 1.47GB
    Dataset2: 17GB
    (cleared data zeroed all background data)
  commands:
    sz_compress: "sz -z -f -i CLDHGH_1_1800_3600.f32 -M REL -R 1E-2 -2 3600 1800"
    sz_decompress: "sz -x -f -i CLDHGH_1_1800_3600.f32 -2 3600 1800 -s CLDHGH_1_1800_3600.f32.sz -a"
    zfp: "zfp -f -i CLDHGH_1_1800_3600.f32 -z CLDHGH_1_1800_3600.f32.zfp -o CLDHGH_1_1800_3600.f32.zfp.out -2 3600 1800 -a 1E-2 -s"
    libpressio: "pressio -b compressor=$COMP -i CLDHGH_1_1800_3600.f32 -d 3600 -d 1800 -t float -o rel=1e-2 -m time -m size -M all"
    libpressio_note: "where $COMP can be sz, zfp, sz3, mgard, etc."
    zchecker: "./runZCCase.sh -f REL CESM-ATM raw-data-dir f32 3600 1800"
  links:
    - { label: "Dataset1 (raw)", url: "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/CESM-ATM/SDRBENCH-CESM-ATM-1800x3600.tar.gz" }
    - { label: "Dataset1 (cleared)", url: "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/CESM-ATM/SDRBENCH-CESM-ATM-cleared-1800x3600.tar.gz" }
    - { label: "Dataset2 (raw)", url: "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/CESM-ATM/SDRBENCH-CESM-ATM-26x1800x3600.tar.gz" }
    - { label: "Metadata", url: "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/CESM-ATM/template_data.txt" }
    - { label: "Dataset1 Property", url: "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/CESM-ATM/SDRBENCH-CESM-ATM-cleared-1800x3600-property.txt" }
